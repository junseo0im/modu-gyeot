[project]
name = "gyeot-api"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
